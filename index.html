<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abiau — ёрдамчии AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E8F1EF;
    --panel: #FFFFFF;
    --ink: #10283D;
    --muted: #5B7284;
    --line: #CFE0DC;
    --user: #10283D;
    --user-text: #FFFFFF;
    --bot: #F3F8F7;
    --accent: #0E9AA7;
    --accent-ink: #FFFFFF;
    --err: #B3402F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1A26;
      --panel: #122636;
      --ink: #E6F1F0;
      --muted: #8DA6B3;
      --line: #20394B;
      --user: #0E9AA7;
      --user-text: #FFFFFF;
      --bot: #183146;
      --accent: #2CC3D0;
      --accent-ink: #062029;
      --err: #FF8A75;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  @media (min-width: 800px) {
    body { padding: 24px; }
    .app { border-radius: 20px; border: 1px solid var(--line); overflow: hidden; }
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-weight: 700; font-size: 20px;
  }
  .title { flex: 1; }
  .title h1 { font-size: 18px; font-weight: 700; }
  .title p { font-size: 13px; color: var(--muted); }
  #clear {
    background: none; border: 1px solid var(--line); color: var(--muted);
    padding: 8px 12px; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #clear:hover { color: var(--ink); border-color: var(--muted); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 15.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot);
    border-bottom-left-radius: 4px;
  }
  .msg.error { color: var(--err); }

  .welcome { margin: auto; text-align: center; max-width: 380px; }
  .welcome h2 { font-size: 22px; margin-bottom: 8px; }
  .welcome p { color: var(--muted); margin-bottom: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 9px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--accent); }

  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }

  form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 15.5px;
    line-height: 1.4;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #send {
    border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    height: 46px; padding: 0 20px; border-radius: 14px;
    font: inherit; font-weight: 700;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">A</div>
    <div class="title">
      <h1>Abiau</h1>
      <p>Ёрдамчии AI</p>
    </div>
    <button id="clear" type="button">Сӯҳбати нав</button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Саволатонро нависед..." aria-label="Паём"></textarea>
    <button id="send" type="submit">Фиристодан</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");

  let history = [];

  function showWelcome() {
    chat.innerHTML = `
      <div class="welcome">
        <h2>Салом! Ман Abiau</h2>
        <p>Аз ман ҳар чизе пурсед.</p>
        <div class="chips">
          <button type="button">Худро муаррифӣ кун</button>
          <button type="button">Ба ман ғояи лоиҳа деҳ</button>
          <button type="button">Python чист?</button>
        </div>
      </div>`;
    chat.querySelectorAll(".chips button").forEach(b =>
      b.addEventListener("click", () => send(b.textContent))
    );
  }

  function addMsg(text, who, extra = "") {
    const el = document.createElement("div");
    el.className = `msg ${who} ${extra}`.trim();
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function send(text) {
    text = text.trim();
    if (!text || sendBtn.disabled) return;

    if (history.length === 0) chat.innerHTML = "";
    addMsg(text, "user");
    history.push({ role: "user", content: text });
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    const wait = document.createElement("div");
    wait.className = "msg bot";
    wait.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    chat.appendChild(wait);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      wait.remove();
      if (!res.ok) throw new Error(data.error || "Хатои номаълум");
      addMsg(data.reply, "bot");
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      wait.remove();
      addMsg(err.message, "bot", "error");
      history.pop();
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  clearBtn.addEventListener("click", () => { history = []; showWelcome(); });

  showWelcome();
</script>
</body>
</html>
